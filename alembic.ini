# Repo-root alembic config.
#
# The real config lives in migrations/alembic.ini, which only resolves when
# alembic is invoked from inside migrations/. The deploy (.github/workflows/
# deployment.yml) runs `cd $TARGET_DIR && alembic upgrade head` from the repo
# ROOT, where alembic found no config and exited with "No 'script_location' key
# found in configuration" — so migrations have never actually run on deploy.
# This file makes the documented command work from the repo root.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# The URL is supplied by migrations/env.py from app settings, not from here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
