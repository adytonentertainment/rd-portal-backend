<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="x-apple-disable-message-reformatting" />
        <title>{{ title }}</title>
        <!--[if mso]>
            <style type="text/css">
                body,
                table,
                td {
                    font-family: Arial, Helvetica, sans-serif !important;
                }
            </style>
        <![endif]-->
        <style type="text/css">
            /* Client-specific Styles */
            body {
                width: 100% !important;
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
                margin: 0;
                padding: 0;
            }

            /* Prevent Outlook from adding extra spacing */
            table,
            td {
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
            }

            /* Use better rendering in IE */
            img {
                -ms-interpolation-mode: bicubic;
            }

            /* Mobile Styles */
            @media only screen and (max-width: 600px) {
                table[id="templateContainer"] {
                    width: 100% !important;
                    border-radius: 0 !important;
                }

                .headerContent img {
                    max-width: 150px !important;
                    height: auto !important;
                }

                .bodyContent {
                    padding: 20px !important;
                }

                .bodyContent h1 {
                    font-size: 24px !important;
                }

                .bodyContent p {
                    font-size: 15px !important;
                }
            }
        </style>
    </head>
    <body
        leftmargin="0"
        marginwidth="0"
        topmargin="0"
        marginheight="0"
        offset="0"
        style="
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            margin: 0;
            padding: 0;
            width: 100% !important;
            background-color: #f5f5f0;
        "
    >
        <center style="background-color: #f5f5f0; padding: 20px 0">
            <table
                border="0"
                cellpadding="0"
                cellspacing="0"
                height="100%"
                width="100%"
                id="backgroundTable"
                style="
                    margin: 0;
                    padding: 0;
                    height: 100% !important;
                    width: 100% !important;
                    background-color: #f5f5f0;
                "
            >
                <tr>
                    <td
                        align="center"
                        valign="top"
                        style="padding: 20px; border-collapse: collapse"
                    >
                        <!-- Main Container -->
                        <table
                            border="0"
                            cellpadding="0"
                            cellspacing="0"
                            width="600"
                            id="templateContainer"
                            style="
                                border: 2px solid #2c2c2c;
                                background-color: #f5f5f0;
                                border-radius: 8px;
                                overflow: hidden;
                                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                            "
                        >
                            <tr>
                                <td
                                    align="center"
                                    valign="top"
                                    style="border-collapse: collapse"
                                >
                                    <!-- Header -->
                                    <table
                                        border="0"
                                        cellpadding="0"
                                        cellspacing="0"
                                        width="600"
                                        id="templateHeader"
                                        style="
                                            background-color: #fafaf8;
                                            border-bottom: 2px solid #2c2c2c;
                                        "
                                    >
                                        <tr>
                                            <td
                                                class="headerContent"
                                                style="
                                                    border-collapse: collapse;
                                                    padding: 40px 20px 30px;
                                                    text-align: center;
                                                    vertical-align: middle;
                                                "
                                            >
                                                <!-- Logo -->
                                                <span style="font-size:28px; font-weight:700; color:#2c2c2c; letter-spacing:-0.02em;">VERAX</span>
                                            </td>
                                        </tr>
                                    </table>
                                    <!-- End Header -->
                                </td>
                            </tr>
                            <tr>
                                <td
                                    align="center"
                                    valign="top"
                                    style="border-collapse: collapse"
                                >
                                    <!-- Body -->
                                    <table
                                        border="0"
                                        cellpadding="0"
                                        cellspacing="0"
                                        width="600"
                                        id="templateBody"
                                    >
                                        <tr>
                                            <td
                                                valign="top"
                                                style="
                                                    border-collapse: collapse;
                                                "
                                            >
                                                <!-- Content -->
                                                <table
                                                    border="0"
                                                    cellpadding="30"
                                                    cellspacing="0"
                                                    width="100%"
                                                >
                                                    <tr>
                                                        <td
                                                            valign="top"
                                                            class="bodyContent"
                                                            style="
                                                                border-collapse: collapse;
                                                                background-color: #fafaf8;
                                                            "
                                                        >
                                                            <div
                                                                style="
                                                                    color: #1f2937;
                                                                    font-family:
                                                                        &quot;Inter&quot;,
                                                                        -apple-system,
                                                                        BlinkMacSystemFont,
                                                                        &quot;Segoe UI&quot;,
                                                                        sans-serif;
                                                                    font-size: 16px;
                                                                    line-height: 1.6;
                                                                    text-align: left;
                                                                "
                                                            >
                                                                <h1
                                                                    style="
                                                                        color: #2c2c2c;
                                                                        font-size: 28px;
                                                                        font-weight: 600;
                                                                        line-height: 1.2;
                                                                        margin: 0
                                                                            0
                                                                            20px
                                                                            0;
                                                                        text-align: center;
                                                                        letter-spacing: -0.02em;
                                                                    "
                                                                >
                                                                    {{ title }}
                                                                </h1>
                                                                <p
                                                                    style="
                                                                        color: #1f2937;
                                                                        margin: 0
                                                                            0
                                                                            20px
                                                                            0;
                                                                    "
                                                                >
                                                                    {{
                                                                    message|safe
                                                                    }}
                                                                </p>
                                                                <p
                                                                    style="
                                                                        color: #71717a;
                                                                        margin: 20px
                                                                            0 0
                                                                            0;
                                                                    "
                                                                >
                                                                    Kind
                                                                    regards,<br />
                                                                    <strong
                                                                        style="
                                                                            color: #2c2c2c;
                                                                        "
                                                                        >your
                                                                        Verax
                                                                        Team</strong
                                                                    >
                                                                </p>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    {% if button %}
                                                    <tr>
                                                        <td
                                                            align="center"
                                                            valign="top"
                                                            style="
                                                                padding: 0 30px
                                                                    30px 30px;
                                                                border-collapse: collapse;
                                                                background-color: #fafaf8;
                                                            "
                                                        >
                                                            <!--[if mso]>
                                                                <v:roundrect
                                                                    xmlns:v="urn:schemas-microsoft-com:vml"
                                                                    xmlns:w="urn:schemas-microsoft-com:office:word"
                                                                    href="{{ button_url }}"
                                                                    style="
                                                                        height: 48px;
                                                                        v-text-anchor: middle;
                                                                        width: 200px;
                                                                    "
                                                                    arcsize="8%"
                                                                    strokecolor="#2C2C2C"
                                                                    fillcolor="#2C2C2C"
                                                                >
                                                                    <w:anchorlock />
                                                                    <center
                                                                        style="
                                                                            color: #ffffff;
                                                                            font-family: sans-serif;
                                                                            font-size: 15px;
                                                                            font-weight: 600;
                                                                        "
                                                                    >
                                                                        {{
                                                                        button
                                                                        }}
                                                                    </center>
                                                                </v:roundrect>
                                                            <![endif]-->
                                                            <!--[if !mso]><!-->
                                                            <table
                                                                border="0"
                                                                cellpadding="0"
                                                                cellspacing="0"
                                                                style="
                                                                    border-collapse: separate;
                                                                "
                                                            >
                                                                <tr>
                                                                    <td
                                                                        align="center"
                                                                        style="
                                                                            border-collapse: collapse;
                                                                        "
                                                                    >
                                                                        <a
                                                                            href="{{ button_url }}"
                                                                            target="_blank"
                                                                            style="
                                                                                display: inline-block;
                                                                                padding: 14px
                                                                                    32px;
                                                                                background: #2c2c2c;
                                                                                color: #ffffff;
                                                                                font-family:
                                                                                    &quot;Inter&quot;,
                                                                                    -apple-system,
                                                                                    sans-serif;
                                                                                font-size: 15px;
                                                                                font-weight: 600;
                                                                                text-decoration: none;
                                                                                border-radius: 4px;
                                                                                letter-spacing: 0.0125em;
                                                                                text-transform: uppercase;
                                                                                box-shadow: 0
                                                                                    2px
                                                                                    8px
                                                                                    rgba(
                                                                                        0,
                                                                                        0,
                                                                                        0,
                                                                                        0.08
                                                                                    );
                                                                            "
                                                                        >
                                                                            {{
                                                                            button
                                                                            }}
                                                                        </a>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                            <!--<![endif]-->
                                                        </td>
                                                    </tr>
                                                    {% endif %}
                                                </table>
                                                <!-- End Content -->
                                            </td>
                                        </tr>
                                    </table>
                                    <!-- End Body -->
                                </td>
                            </tr>
                            <tr>
                                <td
                                    align="center"
                                    valign="top"
                                    style="border-collapse: collapse"
                                >
                                    <!-- Footer -->
                                    <table
                                        border="0"
                                        cellpadding="20"
                                        cellspacing="0"
                                        width="600"
                                        id="templateFooter"
                                        style="
                                            background-color: #fafaf8;
                                            border-top: 2px solid #2c2c2c;
                                        "
                                    >
                                        <tr>
                                            <td
                                                valign="top"
                                                class="footerContent"
                                                style="
                                                    border-collapse: collapse;
                                                "
                                            >
                                                <table
                                                    border="0"
                                                    cellpadding="10"
                                                    cellspacing="0"
                                                    width="100%"
                                                >
                                                    <tr>
                                                        <td
                                                            align="center"
                                                            style="
                                                                border-collapse: collapse;
                                                            "
                                                        >
                                                            <div
                                                                style="
                                                                    color: #71717a;
                                                                    font-family:
                                                                        &quot;Inter&quot;,
                                                                        -apple-system,
                                                                        sans-serif;
                                                                    font-size: 13px;
                                                                    line-height: 1.5;
                                                                    text-align: center;
                                                                "
                                                            >
                                                                <a
                                                                    href="https://www.instagram.com/verax.app/"
                                                                    target="_blank"
                                                                    style="
                                                                        color: #5bc0f8;
                                                                        font-weight: 500;
                                                                        text-decoration: none;
                                                                        margin: 0
                                                                            8px;
                                                                    "
                                                                    >Instagram</a
                                                                >
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td
                                                            align="center"
                                                            style="
                                                                border-collapse: collapse;
                                                                padding-top: 15px;
                                                            "
                                                        >
                                                            <div
                                                                style="
                                                                    color: #71717a;
                                                                    font-family:
                                                                        &quot;Inter&quot;,
                                                                        -apple-system,
                                                                        sans-serif;
                                                                    font-size: 12px;
                                                                    line-height: 1.5;
                                                                    text-align: center;
                                                                "
                                                            >
                                                                <em
                                                                    >Copyright
                                                                    &copy; 2026
                                                                    Verax UG,
                                                                    All rights
                                                                    reserved.</em
                                                                >
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                    </table>
                                    <!-- End Footer -->
                                </td>
                            </tr>
                        </table>
                        <!-- End Main Container -->
                    </td>
                </tr>
            </table>
        </center>
    </body>
</html>
